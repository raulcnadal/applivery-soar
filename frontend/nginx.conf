# Split-deployment Nginx config (frontend/Dockerfile). Two jobs:
#   1. Serve the built Vue SPA, falling back to index.html for any
#      non-file path (vue-router's createWebHistory() needs this — a
#      hard refresh on e.g. /devices has no matching file on disk).
#   2. Reverse-proxy /api/* to the backend service so the browser only
#      ever talks to this one origin — no CORS configuration needed on
#      the backend (its CORS_ORIGINS env var still exists for anyone
#      hitting it directly, but the frontend itself never needs it).

server {
    listen 80;
    server_name _;

    # Config export/import (Settings > Backup & Restore) and scheduled
    # report bundles can be a few MB — default 1m is too small.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location /api/ {
        proxy_pass http://soar-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Report generation (Puppeteer PDF render) and large config
        # export/import can take a while — default 60s is too tight.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
