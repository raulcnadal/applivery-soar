# Docker Compose for the BlueSky-stack rewrite (Vue 3 + Node/TS + Prisma +
# Postgres) — separate from the original /docker-compose.yml (FastAPI +
# React + per-workspace SQLite) so the two stacks can run side by side
# during the incremental migration (migration-plan.md §8).
#
# Split-service topology (post-migration scale review): frontend and backend
# are now separate services rather than one container serving both — the
# original had Postgres on its own service too, so this follows that same
# pattern one layer further up. soar-frontend (Nginx) serves the built Vue
# SPA and reverse-proxies /api/* to soar-backend, so the browser only ever
# talks to one origin (no CORS needed). soar-backend still builds from the
# existing backend/Dockerfile unchanged — the same image docker-publish.yml
# ships as the single-container reference build — it just runs API-only
# here; its own bundled frontend/dist goes unused since soar-frontend's
# Nginx is what actually serves the SPA in this topology.
#
# soar-redis is optional-but-provisioned: only matters if soar-backend is
# scaled to more than one replica (`docker compose -f docker-compose.newstack.yml
# up --scale soar-backend=3`), in which case REDIS_URL makes every
# background job (compliance evaluator, workflow resumer, ticket sync, etc.)
# run as a BullMQ repeatable job — exactly once cluster-wide — instead of
# each replica's own in-process setInterval loop firing independently.
#
# Usage: docker compose -f docker-compose.newstack.yml up --build

services:
  soar-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: soar-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - soar-backend

  soar-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: soar-backend
    restart: unless-stopped
    ports:
      # Published for direct API access/debugging; soar-frontend reaches
      # this over the internal Compose network regardless (see nginx.conf's
      # proxy_pass http://soar-backend:8000).
      - "8000:8000"
    environment:
      - DASHBOARD_SECRET=${DASHBOARD_SECRET}
      - DATABASE_URL=postgresql://soar:${POSTGRES_PASSWORD}@soar-db:5432/soar?schema=public
      - APPLIVERY_API_URL=${APPLIVERY_API_URL:-https://api.applivery.io/v1}
      - APPLIVERY_RATE_LIMIT_PER_HOUR=${APPLIVERY_RATE_LIMIT_PER_HOUR:-10000}
      - APPLIVERY_RATE_LIMIT_BURST=${APPLIVERY_RATE_LIMIT_BURST:-100}
      - TRIGGER_SECRET=${TRIGGER_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Optional — leave unset for a single soar-backend replica (the
      # default; needs no Redis). Set to enable the queue-backed job path,
      # e.g. if you scale soar-backend to multiple replicas.
      - REDIS_URL=${REDIS_URL:-}
    depends_on:
      soar-db:
        condition: service_healthy

  soar-db:
    image: postgres:16-alpine
    container_name: soar-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=soar
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=soar
    volumes:
      - ./pgdata-newstack:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soar -d soar"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # Exposed on the host for local Prisma Studio / psql access during
      # development — remove in a real production deployment.
      - "5432:5432"

  soar-redis:
    image: redis:7-alpine
    container_name: soar-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redisdata-newstack:/data
