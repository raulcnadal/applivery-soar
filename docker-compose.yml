# NOTE on naming: this compose file runs the LEGACY FastAPI + React build
# (big-picture-api/ + wow-dashboard/) being replaced by the BlueSky-stack
# rewrite (see docker-compose.newstack.yml). Container/service names and the
# image tag below have been renamed to the "Applivery SOAR" branding used
# everywhere else in the repo now — POSTGRES_USER/POSTGRES_DB and the
# ./data/./pgdata bind-mount paths are DELIBERATELY left unchanged, since
# those are what an already-running deployment's persisted data actually
# depends on; renaming them would make Postgres look for a database that
# doesn't exist in an already-initialized data directory. If you're
# deploying this fresh (no existing ./data or ./pgdata), the identifiers
# below are otherwise free to rename further. The image tag
# `raulcnadal/applivery-soar:legacy-arm64-advanced` is NOT auto-published by
# any workflow in this repo (docker-publish.yml only publishes the new
# stack's image, also under the `raulcnadal/applivery-soar` repo but with
# `latest`/`sha-*` tags) — you'll need to build and push/retag this image
# yourself under that name before `docker compose up` can pull it.
services:
  applivery-soar-legacy:
    image: raulcnadal/applivery-soar:legacy-arm64-advanced
    container_name: applivery-soar-legacy
    restart: unless-stopped
    # ports:
    #   - "2026:8000"
    expose:
      - 8000
    networks:
      - npm-network
      - db-network
    environment:
      - DASHBOARD_SECRET=${DASHBOARD_SECRET}
      - DATABASE_URL=postgresql://applivery:${POSTGRES_PASSWORD}@applivery-soar-legacy-db:5432/applivery_big_picture
      # Optional — see .env for what these unlock.
      # - AUTOMATION_ORG_SLUG=${AUTOMATION_ORG_SLUG}
      # - AUTOMATION_API_TOKEN=${AUTOMATION_API_TOKEN}
      # - TRIGGER_SECRET=${TRIGGER_SECRET}
    volumes:
      # Maps a local 'data' folder to the app's internal storage
      - ./data:/app/data
    depends_on:
      applivery-soar-legacy-db:
        condition: service_healthy

  applivery-soar-legacy-db:
    image: postgres:16-alpine
    container_name: applivery-soar-legacy-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=applivery
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=applivery_big_picture
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applivery -d applivery_big_picture"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-network

networks:
  npm-network:
    external: true
  # Private network shared only between the app and its database — Postgres
  # is never exposed on npm-network, so nothing else on that shared network
  # can reach it.
  db-network:
    driver: bridge
