# Docker Compose for Applivery SOAR (Vue 3 + Node/TS + Prisma + Postgres).
#
# Split-service topology: soar-frontend (Nginx) serves the built Vue SPA and
# reverse-proxies /api/* to soar-backend, so the browser only ever talks to
# one origin (no CORS needed). soar-backend runs API-only; its own bundled
# frontend/dist goes unused since soar-frontend's Nginx is what actually
# serves the SPA in this topology.
#
# Both services pull pre-built multi-arch images from GitHub Container
# Registry (ghcr.io), attached to this repo (docker-publish.yml publishes
# both on every push to main) — no local build or repo checkout required to
# deploy. If you're working on the source and want to build locally instead,
# layer docker-compose.build.yml on top: `docker compose -f
# docker-compose.yml -f docker-compose.build.yml up --build`.
#
# These packages are private (inherited from the repo's own visibility), so
# the deployment host needs a one-time login before its first pull:
#   echo "$GHCR_PAT" | docker login ghcr.io -u <github-username> --password-stdin
# where GHCR_PAT is a GitHub personal access token with at least
# `read:packages` scope. Docker caches that login in the host's own
# ~/.docker/config.json, so this is a one-time setup step per host, not
# something needed on every `docker compose pull`.
#
# soar-redis is optional-but-provisioned: only matters if soar-backend is
# scaled to more than one replica (`docker compose up --scale soar-backend=3`),
# in which case REDIS_URL makes every background job (compliance evaluator,
# workflow resumer, ticket sync, etc.) run as a BullMQ repeatable job —
# exactly once cluster-wide — instead of each replica's own in-process
# setInterval loop firing independently.
#
# Usage: docker compose pull && docker compose up -d

services:
  soar-frontend:
    image: ghcr.io/raulcnadal/applivery-soar-frontend:latest
    # Forces a manifest re-check against GHCR on every deploy/redeploy
    # (Portainer's "re-pull image" option, `docker compose up --pull always`,
    # etc.), instead of silently reusing whatever digest is already cached
    # locally under the `:latest` tag. Without this, some orchestrators only
    # pull when the tag is entirely absent locally, so a new image published
    # under the same `:latest` tag can go unnoticed on redeploy.
    pull_policy: always
    container_name: soar-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - soar-backend

  soar-backend:
    image: ghcr.io/raulcnadal/applivery-soar:latest
    pull_policy: always
    container_name: soar-backend
    restart: unless-stopped
    ports:
      # Published for direct API access/debugging; soar-frontend reaches
      # this over the internal Compose network regardless (see nginx.conf's
      # proxy_pass http://soar-backend:8000).
      - "8000:8000"
    environment:
      - DASHBOARD_SECRET=${DASHBOARD_SECRET}
      - DATABASE_URL=postgresql://soar:${POSTGRES_PASSWORD}@soar-db:5432/soar?schema=public
      - APPLIVERY_API_URL=${APPLIVERY_API_URL:-https://api.applivery.io/v1}
      - APPLIVERY_RATE_LIMIT_PER_HOUR=${APPLIVERY_RATE_LIMIT_PER_HOUR:-10000}
      - APPLIVERY_RATE_LIMIT_BURST=${APPLIVERY_RATE_LIMIT_BURST:-100}
      - TRIGGER_SECRET=${TRIGGER_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # Optional — leave unset for a single soar-backend replica (the
      # default; needs no Redis). Set to enable the queue-backed job path,
      # e.g. if you scale soar-backend to multiple replicas.
      - REDIS_URL=${REDIS_URL:-}
    depends_on:
      soar-db:
        condition: service_healthy

  soar-db:
    image: postgres:16-alpine
    container_name: soar-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=soar
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=soar
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soar -d soar"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      # Exposed on the host for local Prisma Studio / psql access during
      # development — remove in a real production deployment.
      - "5432:5432"

  soar-redis:
    image: redis:7-alpine
    container_name: soar-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redisdata:/data
