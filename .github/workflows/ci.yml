name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: soar
          POSTGRES_PASSWORD: soar
          POSTGRES_DB: soar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soar -d soar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DASHBOARD_SECRET: ci-only-secret-not-used-in-prod
      DATABASE_URL: postgresql://soar:soar@localhost:5432/soar?schema=public
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Validates the Prisma schema against a real Postgres instance and
      # applies migrations — the exact step that can't run in a network-
      # restricted sandbox, now verified on every push.
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      - run: npm run typecheck
      - run: npm run build
      - run: npx vitest run --passWithNoTests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The frontend depends on the vendored BlueSky Vue component library
      # via a relative path alias (frontend/vite.config.ts), so its own
      # node_modules (clsx, tailwind-merge) need installing too.
      - name: Install BlueSky Vue component library deps
        working-directory: packages/bluesky-vue
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Typecheck + build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npx vitest run --passWithNoTests
