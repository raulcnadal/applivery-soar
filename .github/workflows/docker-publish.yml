name: Docker publish

on:
  push:
    branches: [main]

# Needed to push images to GitHub Container Registry (ghcr.io) using the
# workflow's own auto-issued GITHUB_TOKEN — no external registry secrets
# required. `contents: read` is the default checkout permission.
permissions:
  contents: read
  packages: write

jobs:
  # Builds each (component, architecture) combination natively (no QEMU) in
  # parallel: linux/amd64 on a standard x86 runner, linux/arm64 on GitHub's
  # hosted arm64 runner (ubuntu-24.04-arm — free-for-public/standard-billed-
  # for-private since the Jan 2026 GA). QEMU-emulated arm64 was taking 20+
  # minutes because emulation is brutally slow for anything doing lots of
  # small-file I/O (three separate `npm install`s); native arm64 hardware
  # avoids that entirely. Each job pushes its single-arch image by digest
  # only (no tag yet) — the `merge` job below combines each component's two
  # digests into one multi-arch manifest under the real tags.
  #
  # Two images are published to GitHub Container Registry (ghcr.io), attached
  # to this repo: `applivery-soar` (backend/Dockerfile — the single-container
  # build, frontend bundled in and served by Express; this is also the
  # API-only image used for the `soar-backend` service in the
  # split-deployment topology) and `applivery-soar-frontend`
  # (frontend/Dockerfile — Nginx serving the built Vue SPA, used only by the
  # split topology's `soar-frontend` service). See docker-compose.yml.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: ghcr.io/raulcnadal/applivery-soar
            dockerfile: backend/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - component: backend
            image: ghcr.io/raulcnadal/applivery-soar
            dockerfile: backend/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - component: frontend
            image: ghcr.io/raulcnadal/applivery-soar-frontend
            dockerfile: frontend/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - component: frontend
            image: ghcr.io/raulcnadal/applivery-soar-frontend
            dockerfile: frontend/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Platform tag (for artifact naming)
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.component }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: ghcr.io/raulcnadal/applivery-soar
          - component: frontend
            image: ghcr.io/raulcnadal/applivery-soar-frontend
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ matrix.image }}@sha256:%s ' *)

      - name: Inspect pushed manifest
        run: docker buildx imagetools inspect ${{ matrix.image }}:latest
